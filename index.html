<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waleed Fresh — Weekly Target Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1115">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b35;
    --text: #e7e9ee;
    --muted: #9aa1ad;
    --accent: #4ade80;
    --target: #f87171;
    --below: #f87171;
    --above: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 14px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .month-selector {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  select, input[type=number] {
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  select { flex: 1; min-width: 100px; }
  #yearSelect { flex: 0 0 90px; min-width: 90px; }
  .weeks-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .week-input {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .week-input label {
    font-size: 12px;
    color: var(--muted);
  }
  .week-input input {
    width: 100%;
    font-size: 15px;
  }
  .summary {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .stat {
    flex: 1;
    min-width: 100px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .value.good { color: var(--above); }
  .value.bad { color: var(--below); }
  canvas { max-height: 300px; }
  .target-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .target-row label { font-size: 13px; color: var(--muted); }
  .target-row input { width: 100px; }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .save-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .save-btn, .restore-btn {
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .save-btn {
    background: var(--accent);
    color: #0f1115;
    border-color: var(--accent);
  }
  .restore-btn {
    background: none;
    color: var(--text);
  }
  .status-msg {
    font-size: 12px;
    color: var(--muted);
  }
  .status-msg.unsaved { color: var(--target); }
  .status-msg.syncing { color: #fbbf24; }
</style>
</head>
<body>

<div id="lockScreen" style="position:fixed; inset:0; background:#0f1115; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; padding:20px;">
  <div style="font-size:32px;">🔒</div>
  <div style="color:#e7e9ee; font-size:16px; font-weight:600;">Sign in</div>
  <input type="email" id="emailInput" placeholder="Email" autocomplete="username" style="background:#171a21; border:1px solid #262b35; color:#e7e9ee; border-radius:8px; padding:12px 14px; font-size:15px; width:240px;">
  <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" style="background:#171a21; border:1px solid #262b35; color:#e7e9ee; border-radius:8px; padding:12px 14px; font-size:15px; width:240px;">
  <button id="pwSubmit" style="background:#4ade80; color:#0f1115; border:none; border-radius:8px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; width:240px;">Sign in</button>
  <div id="pwError" style="color:#f87171; font-size:13px; min-height:16px;"></div>
</div>

<div id="appContent" style="display:none;">

<h1>Waleed Fresh — Weekly Target Tracker</h1>
<div class="sub">Actual weekly takings vs your target, 4 weeks per month.</div>

<div class="card">
  <div class="target-row">
    <label for="targetInput">Weekly target (£)</label>
    <input type="number" id="targetInput" value="625" step="5">
  </div>
  <div class="month-selector">
    <select id="yearSelect" style="flex: 0 0 100px;"></select>
    <select id="monthSelect"></select>
    <button class="reset-btn" id="resetBtn">Reset this month</button>
  </div>
  <div class="weeks-grid" id="weeksGrid"></div>
  <div class="summary" id="summary"></div>
  <div class="save-row">
    <button class="save-btn" id="saveBtn">💾 Save</button>
    <button class="restore-btn" id="restoreBtn">↺ Restore</button>
    <button class="restore-btn" id="signOutBtn">Sign out</button>
    <span id="statusMsg" class="status-msg"></span>
  </div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <canvas id="yearChart"></canvas>
</div>

</div>

<script>
const STORAGE_KEY = 'waleedFreshWeeklyTracker'; // used only as an offline fallback cache
const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// ---- Firebase setup ----
const firebaseConfig = {
  apiKey: "AIzaSyCkAIUbhAQM49ChdaMVmtF7Eqn1ewSjzQk",
  authDomain: "fresh-monthly-tracker.firebaseapp.com",
  projectId: "fresh-monthly-tracker",
  storageBucket: "fresh-monthly-tracker.firebasestorage.app",
  messagingSenderId: "880080109458",
  appId: "1:880080109458:web:728194668b688a36dbcb4b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const docRef = db.collection('waleedFreshSecure').doc('data');

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveLocalCache(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function migrate(data) {
  if (!data.target) data.target = 625;
  if (!data.months) data.months = {};
  Object.keys(data.months).forEach(k => {
    if (!k.includes('-')) {
      const nowMigrate = new Date();
      const newKey = nowMigrate.getFullYear() + '-' + k;
      if (!data.months[newKey]) data.months[newKey] = data.months[k];
      delete data.months[k];
    }
  });
  return data;
}

async function loadData() {
  try {
    const snap = await docRef.get();
    if (snap.exists) {
      const data = migrate(snap.data());
      saveLocalCache(data);
      return data;
    }
  } catch (e) {
    console.error('Firestore load failed, using local cache', e);
  }
  const cached = loadLocalCache();
  return migrate(cached || { target: 625, months: {} });
}

async function persist(data) {
  saveLocalCache(data);
  await docRef.set(data);
}

let savedState = { target: 625, months: {} };
let state = clone(savedState);
let dirty = false;

function markDirty() {
  dirty = true;
  const el = document.getElementById('statusMsg');
  if (el) { el.textContent = 'Unsaved changes'; el.className = 'status-msg unsaved'; }
}

function markClean(msg) {
  dirty = false;
  const el = document.getElementById('statusMsg');
  if (el) { el.textContent = msg; el.className = 'status-msg'; }
}

function markSyncing(msg) {
  const el = document.getElementById('statusMsg');
  if (el) { el.textContent = msg; el.className = 'status-msg syncing'; }
}

const now = new Date();
const currentMonthIdx = now.getMonth();
const currentYear = now.getFullYear();

const yearSelect = document.getElementById('yearSelect');
for (let y = 2026; y <= 2036; y++) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  if (y === currentYear || (currentYear < 2026 && y === 2026)) opt.selected = true;
  yearSelect.appendChild(opt);
}

const monthSelect = document.getElementById('monthSelect');
months.forEach((m, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = m;
  if (i === currentMonthIdx) opt.selected = true;
  monthSelect.appendChild(opt);
});

const targetInput = document.getElementById('targetInput');
targetInput.value = state.target;

function monthKey(year, monthIdx) {
  return year + '-' + monthIdx;
}

function getMonthData(year, monthIdx) {
  const key = monthKey(year, monthIdx);
  if (!state.months[key]) {
    state.months[key] = [state.target, state.target, state.target, state.target];
  }
  return state.months[key];
}

let weekChart, yearChart;

function renderWeeks() {
  const year = yearSelect.value;
  const idx = monthSelect.value;
  const data = getMonthData(year, idx);
  const grid = document.getElementById('weeksGrid');
  grid.innerHTML = '';
  data.forEach((val, i) => {
    const div = document.createElement('div');
    div.className = 'week-input';
    div.innerHTML = `<label>Week ${i+1}</label><input type="number" data-week="${i}" value="${val}" step="5">`;
    grid.appendChild(div);
  });
  grid.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const w = parseInt(e.target.dataset.week);
      const v = parseFloat(e.target.value) || 0;
      getMonthData(yearSelect.value, monthSelect.value)[w] = v;
      markDirty();
      renderSummary();
      renderChart();
      renderYearChart();
    });
  });
}

function renderSummary() {
  const year = yearSelect.value;
  const idx = monthSelect.value;
  const data = getMonthData(year, idx);
  const target = state.target;
  const total = data.reduce((a,b) => a+b, 0);
  const monthTarget = target * 4;
  const diff = total - monthTarget;
  const summary = document.getElementById('summary');
  summary.innerHTML = `
    <div class="stat"><div class="label">Month total</div><div class="value ${diff>=0?'good':'bad'}">£${total.toFixed(0)}</div></div>
    <div class="stat"><div class="label">Month target</div><div class="value">£${monthTarget.toFixed(0)}</div></div>
    <div class="stat"><div class="label">Vs target</div><div class="value ${diff>=0?'good':'bad'}">${diff>=0?'+':''}£${diff.toFixed(0)}</div></div>
  `;
}

function renderChart() {
  const year = yearSelect.value;
  const idx = monthSelect.value;
  const data = getMonthData(year, idx);
  const target = state.target;
  const labels = ['Week 1','Week 2','Week 3','Week 4'];
  const ctx = document.getElementById('chart').getContext('2d');
  if (weekChart) weekChart.destroy();
  weekChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Actual',
          data,
          backgroundColor: data.map(v => v >= target ? '#4ade80' : '#f87171'),
          borderRadius: 6,
        },
        {
          label: 'Target (£' + target + ')',
          data: labels.map(() => target),
          type: 'line',
          borderColor: '#f87171',
          borderDash: [6,4],
          pointRadius: 0,
          borderWidth: 2,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#e7e9ee' } },
        title: { display: true, text: months[idx] + ' ' + year + ' — Actual vs Target', color: '#e7e9ee' }
      },
      scales: {
        x: { ticks: { color: '#9aa1ad' }, grid: { color: '#262b35' } },
        y: { ticks: { color: '#9aa1ad' }, grid: { color: '#262b35' }, beginAtZero: true, min: 0, max: 2000 }
      }
    }
  });
}

function renderYearChart() {
  const year = yearSelect.value;
  const target = state.target;
  const labels = months;
  const totals = months.map((m, i) => {
    const d = state.months[monthKey(year, i)];
    if (!d) return null;
    return d.reduce((a,b) => a+b, 0);
  });
  const ctx = document.getElementById('yearChart').getContext('2d');
  if (yearChart) yearChart.destroy();
  yearChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Monthly total',
          data: totals,
          borderColor: '#4ade80',
          backgroundColor: 'rgba(74,222,128,0.15)',
          fill: true,
          tension: 0.3,
          spanGaps: true,
        },
        {
          label: 'Monthly target (£' + (target*4) + ')',
          data: labels.map(() => target*4),
          borderColor: '#f87171',
          borderDash: [6,4],
          pointRadius: 0,
          borderWidth: 2,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#e7e9ee' } },
        title: { display: true, text: year + ' overview — monthly totals vs target', color: '#e7e9ee' }
      },
      scales: {
        x: { ticks: { color: '#9aa1ad' }, grid: { color: '#262b35' } },
        y: { ticks: { color: '#9aa1ad' }, grid: { color: '#262b35' }, beginAtZero: true }
      }
    }
  });
}

monthSelect.addEventListener('change', () => {
  renderWeeks();
  renderSummary();
  renderChart();
});

yearSelect.addEventListener('change', () => {
  renderWeeks();
  renderSummary();
  renderChart();
  renderYearChart();
});

targetInput.addEventListener('input', () => {
  state.target = parseFloat(targetInput.value) || 625;
  markDirty();
  renderWeeks();
  renderSummary();
  renderChart();
  renderYearChart();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  const key = monthKey(yearSelect.value, monthSelect.value);
  state.months[key] = [state.target, state.target, state.target, state.target];
  markDirty();
  renderWeeks();
  renderSummary();
  renderChart();
  renderYearChart();
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  markSyncing('Saving…');
  savedState = clone(state);
  try {
    await persist(savedState);
    markClean('Saved ✓ (synced to cloud)');
  } catch (e) {
    markClean('Saved locally — will sync when online');
  }
});

document.getElementById('restoreBtn').addEventListener('click', () => {
  state = clone(savedState);
  targetInput.value = state.target;
  renderWeeks();
  renderSummary();
  renderChart();
  renderYearChart();
  markClean('Restored last saved version');
});

async function signIn(email, password) {
  const pwError = document.getElementById('pwError');
  pwError.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged below will handle showing the app
  } catch (e) {
    pwError.textContent = 'Incorrect email or password';
  }
}

async function init() {
  markSyncing('Loading…');
  savedState = await loadData();
  state = clone(savedState);
  targetInput.value = state.target;
  renderWeeks();
  renderSummary();
  renderChart();
  renderYearChart();
  markClean('Loaded ✓ (synced from cloud)');
}

document.getElementById('pwSubmit').addEventListener('click', () => {
  const email = document.getElementById('emailInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  signIn(email, pw);
});
[document.getElementById('emailInput'), document.getElementById('pwInput')].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('pwSubmit').click();
  });
});

document.getElementById('signOutBtn').addEventListener('click', () => {
  auth.signOut();
});

// Firebase persists the session across page reloads by default (localStorage-backed),
// so returning users stay signed in without re-entering credentials.
auth.onAuthStateChanged(async (user) => {
  if (user) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    await init();
  } else {
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appContent').style.display = 'none';
  }
});

window.addEventListener('beforeunload', (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>

</body>
</html>
